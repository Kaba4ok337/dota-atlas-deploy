services:
  app:
    build:
      context: ../../DotaCodex_project
    env_file:
      - ../../DotaCodex_project/.env
    environment:
      SITE_URL: https://dota-atlas.localhost

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
